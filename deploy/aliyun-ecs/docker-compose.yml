# 阿里云 ECS 生产环境部署配置
# 使用说明见同目录 README.md

x-backend-env: &backend-env
  TZ: Asia/Shanghai
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-etf}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ad_research}
  REDIS_URL: redis://redis:6379/0
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
  MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
  MINIMAX_CN_API_KEY: ${MINIMAX_CN_API_KEY:-}
  MINIMAX_MODEL: ${MINIMAX_MODEL:-minimax-m3}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
  TIINGO_API_KEY: ${TIINGO_API_KEY:-}
  FMP_API_KEY: ${FMP_API_KEY:-}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?error AUTH_SECRET_KEY is required}
  AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?error AUTH_ADMIN_PASSWORD is required}
  AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_REPO: ${GITHUB_REPO:-}
  FRED_API_KEY: ${FRED_API_KEY:-}
  BEA_API_KEY: ${BEA_API_KEY:-}
  BLS_API_KEY: ${BLS_API_KEY:-}
  # Jina Reader key — lifts the anonymous-tier domain block (investing.com)
  # and raises rate limits for the news full-content pipeline (2026-07-29).
  JINA_API_KEY: ${JINA_API_KEY:-}
  XUEQIU_COOKIE: ${XUEQIU_COOKIE:-}
  WECHAT_RSS_BASE_URL: ${WECHAT_RSS_BASE_URL:-http://wewe-rss:4000}
  WECHAT_RSS_FEED_MAP: ${WECHAT_RSS_FEED_MAP:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
  CNINFO_PDF_DIR: ${CNINFO_PDF_DIR:-/data/alloy-research/cninfo_pdfs}
  # cninfo PDF→Markdown 存档目录（B2，2026-08-03）：md 写盘存档用，
  # DB 的 extracted_text 仍是主存储。
  CNINFO_MD_DIR: ${CNINFO_MD_DIR:-/data/alloy-research/cninfo_md}
  INDICATOR_BACKEND: ${INDICATOR_BACKEND:-sql}

services:
  postgres:
    image: postgres:16-alpine
    container_name: alloyresearch-postgres
    restart: unless-stopped
    # backend(10+20) + celery*2(10+20)*2 + headroom ≈ 90+ concurrent connections possible.
    # Default Postgres max_connections=100 is too tight; raise to 200 and let the kernel
    # shared-memory limits be the real cap (4GB RAM is plenty).
    command: postgres -c max_connections=200
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-ad_research}
      POSTGRES_USER: ${POSTGRES_USER:-etf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etf} -d ${POSTGRES_DB:-ad_research}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - alloyresearch-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: alloyresearch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - alloyresearch-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ad-research:${GIT_SHA:-latest}
    pull_policy: never
    container_name: alloyresearch-backend
    restart: unless-stopped
    expose:
      - "8000"
    # Scheduler must run in exactly one place; the anchor no longer carries
    # ENABLE_SCHEDULER so celery workers never see a misleading "true".
    environment:
      <<: *backend-env
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    # /health always returns HTTP 200; we must parse the body status so nginx and
    # celery-worker don't start before DB/Redis are actually ready.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,json,sys; r=json.loads(urllib.request.urlopen(\"http://localhost:8000/health\",timeout=5).read()); sys.exit(0 if r.get(\"status\")==\"ok\" else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 2026-07-19 deploy-tripwire 配套：start_period 必须覆盖 alembic 大列 ALTER
      # 真实耗时。#280 跑 6 列 etf_indicator numeric(8,4)→(18,6) 物理 rewrite 实测
      # ~5min（300s+），start_period=30s 会让 docker compose healthcheck 在 alembic
      # 期间就标记 unhealthy → 触发依赖回滚（celery-worker-indicator/cninfo/nginx
      # "dependency failed to start" 退出）。提到 240s 留 2x headroom。
      # update.sh 等就绪窗口已从 120s 提到 300s，这里也对应拉长。
      start_period: 240s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - web_dist:/app/web/dist
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # entrypoint (rsync + alembic) and default CMD (uvicorn) live in Dockerfile.
    networks:
      - alloyresearch-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # 2026-08-17: 2G → 3G。uvicorn RSS 缓涨（疑似泄漏/缓存驻留）每天
          # 1~2 次顶到 2GiB 被 memcg OOM kill（dmesg 实锤，backend 14 次
          # restart 全因此）。宿主机 available ~9.4GiB，提限额只是止痛药，
          # 内存增长根因排查另立项。
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M

  celery-worker-indicator:
    image: ad-research:latest
    pull_policy: never
    container_name: alloyresearch-celery-worker-indicator
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - web_dist:/app/web/dist
      - cninfo_pdfs:/data/alloy-research/cninfo_pdfs
    # docker.sock deliberately NOT mounted here (removed 2026-08-06): the
    # cninfo worker parses untrusted PDFs and only the backend deploy panel
    # needs Docker access. Removing it cuts host-root-from-worker-RCE.
    command: celery -A app.core.celery_app worker -E -l info -c 4 -Q indicator
    networks:
      - alloyresearch-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

  celery-worker-cninfo:
    image: ad-research:latest
    pull_policy: never
    container_name: alloyresearch-celery-worker-cninfo
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - web_dist:/app/web/dist
      - cninfo_pdfs:/data/alloy-research/cninfo_pdfs
      - cninfo_md:/data/alloy-research/cninfo_md
    # docker.sock deliberately NOT mounted here (removed 2026-08-06) — see
    # celery-worker-indicator note.
    command: celery -A app.core.celery_app worker -E -l info -c 2 -Q celery,cninfo,industry
    networks:
      - alloyresearch-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # 2026-08-04: 2G → 4G。pymupdf4llm 重提巨型年报 PDF 时子进程
          # RSS ~2GB 撞 memcg OOM（SIGKILL），reextract 任务反复被杀。
          memory: 4G
        reservations:
          cpus: "0.25"
          memory: 256M

  # wewe-rss (2026-07-27): self-hosted WeChat Official-Account → RSS
  # bridge for the independent-WeChat news sources. SQLite variant — no
  # extra DB container. The admin UI binds to localhost only; reach it
  # via `ssh -L 4000:localhost:4000 ad-research` then
  # http://localhost:4000/dash (one-time 微信读书 QR login + adding
  # accounts, see docs/dev-notes/20260727-news-source-expansion.md).
  wewe-rss:
    image: cooderl/wewe-rss-sqlite:latest
    container_name: alloyresearch-wewe-rss
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - wewe_rss_data:/app/data
    environment:
      - DATABASE_TYPE=sqlite
      - AUTH_CODE=${WEWE_RSS_AUTH_CODE:-}
      - CRON_EXPRESSION=${WEWE_RSS_CRON:-35 */1 * * *}
      - MAX_REQUEST_PER_MINUTE=200
    networks:
      - alloyresearch-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: alloyresearch-nginx
    restart: unless-stopped
    ports:
      # 2026-08-17: 8000 明文 HTTP 收敛到 loopback（审计 HIGH 项：
      # 此前 0.0.0.0 公开，绕过 TLS/限流直连后端）。宿主机内部
      # healthcheck/调试仍可用 http://127.0.0.1:8000。
      - "127.0.0.1:8000:8000"
      - "80:80"
      - "443:443"
    volumes:
      - web_dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 2026-08-17 TLS 私钥出仓第一步：证书/私钥/ACME .well-known 移到
      # 仓库外 /data/ad-research/ssl（服务器已 cp -a 同步）。此后仓库内的
      # deploy/aliyun-ecs/ssl/ 不再被挂载，可安全走"重签发+filter-repo
      # 清历史"流程而不会影响线上 TLS。
      - /data/ad-research/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alloyresearch-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  web_dist:
  cninfo_pdfs:
  cninfo_md:
  wewe_rss_data:

networks:
  alloyresearch-network:
    driver: bridge
