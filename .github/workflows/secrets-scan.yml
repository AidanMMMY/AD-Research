name: secrets-scan

# PR 触发：在代码合入 main 之前拦截 secret 泄露。
# push main 触发（2026-08-06 audit 补充）：此前 PR-only 意味着直接 push
# 到 main 完全绕过扫描，而本仓库 push main 即自动部署。加上 push 至少能
# 事后报警 + 阻断后续部署。真正的前置防线仍是 PR 扫描 + 人工 review。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false