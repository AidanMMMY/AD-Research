name: Backend CI

# Backend pytest workflow (added 2026-07-23).
#
# Goal
# ----
# The 14-day audit logs flagged that the repo has 923 pytest cases but
# *no CI gate* — the next deployment was always at risk of re-breaking
# tests because they were never validated against the trunk.  This workflow
# runs the fast unit + service-tier suite on every push to main and on
# every PR targeting app/**, alembic/**, scripts/** or pyproject / poetry
# lockfiles.  ~3 minutes today; we cap it at 15 min for headroom.
#
# Scope
# -----
# * in-process service tests under app/tests/** — uses SQLite in-memory
#   per conftest.py, no Postgres dependency.
# * excludes app/tests/e2e/** (those require the live API + DB).
# * does NOT lint (ruff is local-precommit-only today); that stays
#   out of CI until we add a ruff workflow.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/backend-ci.yml'

jobs:
  pytest:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 2026-07-27: the suite grew env-dependent tests since this workflow
    # was added (1064 tests now vs 933 then):
    #   * app/tests/e2e/test_screening_e2e.py + parts of
    #     app/tests/test_etf_service.py hit the app's cache layer on
    #     localhost:6379 — locally dev machines run redis-server so they
    #     pass; on CI they died with `redis.exceptions.ConnectionError`.
    #   * app/tests/test_etf_a_share_enrichment.py constructs
    #     TushareProvider, which raises unless TUSHARE_TOKEN is set
    #     (HTTP is mocked; a dummy token is enough — tushare only
    #     validates it on a real API call).
    # Provide both here instead of skip-markers so the coverage stays.
    # 2026-08-17: tests no longer share the dev Redis db 0 — app/tests/conftest.py
    # forces REDIS_URL to db 15 and flushdb's it around every test, so the
    # service below only ever sees test traffic on its own isolated db.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # 2026-07-27 (second round): app/tests/test_sql_indicators.py
      # parity tests skip unless the session engine is PostgreSQL —
      # and Settings.database_url defaults to
      # postgresql+psycopg2://etf:etf_research_password@localhost:5432/ad_research,
      # so on CI the dialect check passed but nothing listened on 5432
      # (7 tests died with connection refused). Spin up a throwaway
      # Postgres matching those defaults so the parity tests actually
      # run (they create their own synthetic tables/rows).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etf
          POSTGRES_PASSWORD: etf_research_password
          POSTGRES_DB: ad_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etf -d ad_research"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        # 2026-07-24: setup-python@v5 在 GitHub-hosted ubuntu-latest 上 3 次连续
        # fast-fail（step 0-1s 完成 conclusion=failure），与 cache 配置无关 —
        # 是 actions 内部拉 python distribution 的 transient 网络问题。
        # 退回 v4（更稳定的次新版） + 取消 cache（cache 是非必要优化）。
        # Setup Python 仅装 Python 解释器；poetry install 步骤独立管理依赖。
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install "poetry==1.8.4"

      - name: Install dependencies
        # Use the dev group only — keeping the runtime image tight is
        # not in scope for CI; we just need pytest + sqlalchemy + the
        # full transitive dependency tree that app/* import chain uses.
        run: poetry install --with dev

      - name: Prepare Postgres schema for parity tests
        # test_sql_indicators.py inserts synthetic rows into etf_info /
        # instrument_daily_bar on the default engine — the service
        # container starts empty, so create the schema first.
        run: |
          poetry run python -c "
          import app.models  # noqa: F401 — register all tables on Base.metadata
          from app.core.database import Base, engine
          Base.metadata.create_all(engine)
          print('schema ready:', len(Base.metadata.tables), 'tables')
          "

      - name: Run pytest
        env:
          # Force UTC for any test touching now(); keeps CI logs deterministic.
          TZ: UTC
          PYTHONHASHSEED: '0'
          # Dummy tokens — see the `services:` comment above. HTTP is
          # mocked in these tests; the providers only require a non-empty
          # token at construction time.
          TUSHARE_TOKEN: ci-dummy-token
          FINNHUB_API_KEY: ci-dummy-key
        run: |
          # 2026-07-23: e2e 实测 3.3s + 无外部依赖（SQLite in-memory + TestClient），
          # 之前 --deselect app/tests/e2e 是过度保守。直接并入。
          # 实际 ~930 tests in ~3-4 min，仍在 15min budget 内。
          poetry run pytest -q \
            --no-header --tb=short \
            --maxfail=20

      - name: Upload failure tracebacks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-traces
          path: |
            .pytest_cache/
            **/__pycache__/
          if-no-files-found: ignore
          retention-days: 3

  ruff:
    name: Ruff lint
    # 2026-08-06 deploy audit: CI 此前没有 lint gate，ruff 债一度累积到
    # 1371 项。加为 PR + push main 的强制检查，防止回潮。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.8

      - name: Run ruff check
        run: ruff check app agent research scripts alembic
