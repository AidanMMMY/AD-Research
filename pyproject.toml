[tool.poetry]
name = "ad-research"
version = "0.1.0"
description = "AD-Research"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = { extras = ["asyncpg"], version = "^2.0.36" }
alembic = "^1.14"
psycopg2-binary = "^2.9"
redis = "^5.2"
apscheduler = "^3.11"
celery = "^5.4"
pydantic = "^2.10"
pydantic-settings = "^2.7"
pandas = "^2.2"
numpy = "^2.1"
akshare = "^1.15"
tushare = "^1.4"
yfinance = "^0.2.50"
openai = "^1.0"
anthropic = "^0.40"
requests = "^2.31"
httpx = {extras = ["http2"], version = "^0.28"}
python-dotenv = "^1.0"
python-jose = "^3.3.0"
bcrypt = "^4.2"
cryptography = "^43.0"
scipy = "^1.14"
jinja2 = "^3.1"
pdfplumber = "^0.11"
# pymupdf4llm：cninfo 定期报告 PDF→Markdown 提取主引擎（B2，2026-08-03）。
# 注意：它会拖入 pymupdf_layout + onnxruntime（镜像体积约 +271MB，
# 内存峰值约 1.1GB/进程）。PyMuPDF 本体是 AGPL-3.0——本仓库源码在
# GitHub 公开，满足 AGPL §13 的源码提供义务。
pymupdf4llm = "^1.28"
simhash = "^2.1"
trafilatura = "^2.1.0"
opencc-python-reimplemented = "^0.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.28"
black = "^24.10"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# 2026-08-18：Codex 8/6 给 backend-ci 加了 ruff 强制 gate，但当时遗留的
# 128+ 项存量违规会让 main 永远红灯（8/8 起 Backend CI 已连跪）。auto-fix
# 已清掉全部 [*] 安全项，以下是需要人工逐处判断的存量规则，暂时整体
# ignore 保住 gate 对新违规类型的拦截能力；逐项 burn down 后从此表移除。
ignore = [
    "E501",
    # 存量待清理（截至 2026-08-18 共 ~140 处，见 dev-notes 20260817 扫描报告）
    "N806",   # 函数内非小写变量（39 处，多为 Config/DB 等大写局部变量）
    "E402",   # 模块顶部外导入（34 处，多为 conftest 先改 env 再导 app 的有意时序）
    "SIM105", # contextlib.suppress 可替换（17 处，风格项）
    "B904",   # except 内 raise 缺 from（16 处，需逐处判断异常链语义）
    "B007",   # 循环变量未使用（10 处）
    "SIM117", # 嵌套 with 可合并（8 处）
    "F841",   # 未使用变量（3 处，unsafe-fix 需人工确认无副作用）
    "SIM102", "SIM118", "SIM108", "SIM113", "SIM115",  # 各 ≤2 处风格项
    "N811", "N815", "N818",  # 命名遗留（各 1 处）
    "UP038",  # isinstance 元组→|（1 处 unsafe-fix）
]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"scripts/**/*.py" = ["E402"]
"alembic/**/*.py" = ["E402", "F403"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
